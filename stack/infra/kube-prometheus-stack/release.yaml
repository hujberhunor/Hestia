apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  values:
    alertmanager:
      enabled: false
    grafana:
      admin:
        existingSecret: grafana-admin-credentials
        passwordKey: admin-password
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: monitoring
          folderAnnotation: grafana_folder
      ingress:
        enabled: true
        ingressClassName: nginx
        hosts:
          - grafana.globalstarving.duckdns.org
        paths:
          - /
    prometheus:
      prometheusSpec:
        configReloaderConfig:
          watchInterval: 15s
        enableFeatures:
          - web.enable-lifecycle
        scrapeInterval: 15s
        evaluationInterval: 15s
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "700m"
            memory: "2100Mi"
        storageSpec:
          volumeClaimTemplate:
            metadata:
              name: prometheus-db
            spec:
              storageClassName: local-path
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 60Gi
      ingress:
        enabled: true
        ingressClassName: nginx
        hosts:
          - prometheus.globalstarving.duckdns.org
